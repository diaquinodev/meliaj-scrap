# Carregue como rule_files no Prometheus; configure scrape autenticado por pod.
groups:
  - name: vitrineops
    rules:
      - alert: LLMHighErrorRate
        expr: |
          (
            sum(rate(llm_requests_total{outcome!="success"}[5m]))
            / clamp_min(sum(rate(llm_requests_total[5m])), 0.000001)
          ) > 0.01
          and sum(increase(llm_requests_total[5m])) >= 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Mais de 1% de falhas em geração de rascunhos"
      - alert: LLMHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(llm_request_duration_seconds_bucket[5m]))) > 10
          and sum(increase(llm_request_duration_seconds_count[5m])) >= 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Latência p95 acima de 10 segundos"
