# Exemplo de homologação. Troque a imagem por digest publicado e crie o Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketplace-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: marketplace-intelligence
  template:
    metadata:
      labels:
        app: marketplace-intelligence
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: marketplace-intelligence:replace-with-published-tag
          ports:
            - containerPort: 8001
          env:
            - name: LLM_MODE
              value: demo
            - name: SERVICE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: marketplace-intelligence
                  key: api-token
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8001
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8001
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: marketplace-intelligence
spec:
  selector:
    app: marketplace-intelligence
  ports:
    - port: 8001
      targetPort: 8001
  type: ClusterIP
