name: Case quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m evaluation.run --output evaluation-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: contract-evaluation
          path: evaluation-report.json
      - run: docker build -t marketplace-intelligence:test .
