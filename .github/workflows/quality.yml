name: VitrineOps quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m evaluation.run --output evaluation-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: contract-evaluation
          path: evaluation-report.json
      - run: docker build -t vitrineops:test .
      - name: Smoke test do container
        shell: bash
        run: |
          export SERVICE_API_TOKEN="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker run --detach --rm --name case-api \
            --publish 127.0.0.1:8001:8001 \
            --env SERVICE_API_TOKEN --env LLM_MODE=demo vitrineops:test
          trap 'docker rm --force case-api >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/health/ready >/dev/null; then
              break
            fi
            sleep 1
          done
          python -m scripts.smoke
